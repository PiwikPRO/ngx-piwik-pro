name: Lint PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PiwikPRO/actions
          ref: 1c113aa2675ac4dc8a28c2c1b4c03b6bec93a2fd
          token: ${{ secrets.ACTIONS_READ_TOKEN }}
          path: .shared-actions
          persist-credentials: false
          sparse-checkout: pr-title

      - uses: ./.shared-actions/pr-title
